name: Profile cards

on:
  schedule:
    # Daily at 04:23 UTC
    - cron: "23 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/profile_cards.py
      - assets/fonts/**
      - .github/workflows/profile-cards.yml

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install fonttools
        run: pip install "fonttools>=4.50,<5"

      - name: Refresh contribution data
        env:
          # A token with read:user includes private contributions; GITHUB_TOKEN only sees public ones.
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: python scripts/profile_cards.py fetch

      - name: Render cards
        env:
          PROFILE_EMAIL: ${{ vars.PROFILE_EMAIL }}
        run: python scripts/profile_cards.py render

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github.json cards README.md
          if git diff --cached --quiet; then
            echo "Cards are up to date"
            exit 0
          fi
          git commit -m "chore(cards): refresh profile cards"
          # Another workflow (WakaTime) may have pushed in the meantime
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
